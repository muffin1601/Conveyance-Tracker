<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Conveyance Tracker — tutorial compositor</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1080px; height: 1920px; overflow: hidden;
    background: #0b0e14;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Devanagari", sans-serif;
  }

  /* ── Stage: brand backdrop behind the phone ─────────────────────── */
  #stage { position: absolute; inset: 0; overflow: hidden; }
  #bg {
    position: absolute; inset: -10%;
    background:
      radial-gradient(120% 70% at 50% 0%, #2b2f6b 0%, #141833 45%, #0b0e14 100%);
  }
  #bg-glow {
    position: absolute; left: 50%; top: 44%;
    width: 1400px; height: 1400px; margin: -700px 0 0 -700px;
    background: radial-gradient(circle, rgba(91,91,245,0.30) 0%, rgba(91,91,245,0) 62%);
    filter: blur(20px);
  }

  /* ── Phone ──────────────────────────────────────────────────────── */
  /* Screen is 390x844 CSS px scaled up; SCALE is set from JS so the
     device fills the vertical frame with a small margin. */
  #phone {
    position: absolute; left: 50%; top: 50%;
    transform-origin: 50% 50%;
    border-radius: 54px;
    background: linear-gradient(160deg, #2a2f3d 0%, #12151d 55%, #23283a 100%);
    padding: 11px;
    box-shadow:
      0 40px 90px rgba(0,0,0,0.55),
      0 0 0 1.5px rgba(255,255,255,0.10) inset,
      0 0 70px rgba(91,91,245,0.22);
  }
  #screen {
    position: relative; overflow: hidden;
    border-radius: 44px;
    background: #f7f8fa;
  }
  /* Camera: pans/zooms the app content inside the fixed screen cutout.
     Both layers are sized in APP coordinates (390×844 CSS px, exactly what was
     captured). The camera transform is the single place the app-to-screen
     scale is applied, so annotation boxes recorded during capture line up
     with the pixels without any conversion. */
  #camera, #annot {
    position: absolute; left: 0; top: 0;
    width: 390px; height: 844px;
    transform-origin: 0 0; will-change: transform;
  }
  #camera img {
    position: absolute; left: 0; top: 0;
    width: 390px; height: 844px; display: block;
  }
  /* Two layers so shot changes can cross-fade instead of popping. */
  #imgB { opacity: 0; }
  #annot > * { position: absolute; opacity: 0; will-change: transform, opacity; }

  #ring {
    border: 3px solid #5b5bf5; border-radius: 14px;
    background: rgba(91,91,245,0.08);
    box-shadow: 0 0 0 5px rgba(91,91,245,0.16), 0 0 30px rgba(91,91,245,0.5);
  }
  #ripple {
    border-radius: 999px; border: 3px solid rgba(91,91,245,0.6);
    background: radial-gradient(circle, rgba(91,91,245,0.40) 0%, rgba(91,91,245,0.18) 58%, rgba(91,91,245,0) 74%);
  }
  #pointer {
    width: 52px; height: 52px; border-radius: 999px;
    background: radial-gradient(circle at 34% 30%, rgba(255,255,255,0.97) 0%, rgba(230,232,255,0.75) 42%, rgba(91,91,245,0.5) 100%);
    border: 2.5px solid rgba(255,255,255,0.95);
    box-shadow: 0 8px 22px rgba(6,9,16,0.35), 0 0 26px rgba(91,91,245,0.55);
  }
  #pointer::after {
    content: ""; position: absolute; inset: 16px;
    border-radius: 999px; background: rgba(91,91,245,0.6);
  }
  #arrow { color: #5b5bf5; filter: drop-shadow(0 3px 10px rgba(91,91,245,0.55)); }
  #arrow svg { width: 100%; height: 100%; display: block; }

  /* Dim + cut-out spotlight for "blur the background" moments. */
  #dim { inset: 0; background: rgba(6,9,16,0.5); backdrop-filter: blur(7px); -webkit-backdrop-filter: blur(7px); }
  #spot { box-shadow: 0 0 0 3px rgba(91,91,245,0.9), 0 0 40px 10px rgba(91,91,245,0.4); border-radius: 16px; }

  /* ── Screen-space overlays (do NOT move with the camera) ────────── */
  #hud { position: absolute; inset: 0; pointer-events: none; }
  #hud > * { position: absolute; opacity: 0; will-change: transform, opacity; }

  #callout {
    left: 60px; right: 60px; bottom: 250px;
    padding: 26px 30px; border-radius: 26px;
    background: rgba(12,15,22,0.93);
    box-shadow: 0 26px 70px rgba(0,0,0,0.55), 0 0 0 1.5px rgba(255,255,255,0.09) inset;
    color: #fff; text-align: center;
  }
  #callout b { display: block; font-size: 42px; font-weight: 680; line-height: 1.28; letter-spacing: -0.4px; }
  #callout i { display: block; margin-top: 8px; font-size: 27px; font-style: normal; line-height: 1.35; color: rgba(255,255,255,0.66); }

  /* Chapter title card between sections. */
  #chapter { inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
             background: rgba(8,10,18,0.9); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  #chapter .kicker { font-size: 26px; letter-spacing: 7px; text-transform: uppercase; color: #8f95ff; font-weight: 620; }
  #chapter .title { font-size: 76px; font-weight: 720; color: #fff; letter-spacing: -1.5px; text-align: center; max-width: 900px; line-height: 1.15; }
  #chapter .rule { width: 130px; height: 5px; border-radius: 3px; background: #5b5bf5; }

  /* Hindi subtitle band, burned in only for the subtitled master. */
  #sub {
    left: 50px; right: 50px; bottom: 92px;
    text-align: center; font-size: 36px; line-height: 1.34; font-weight: 560;
    color: #fff; text-shadow: 0 3px 14px rgba(0,0,0,0.85), 0 1px 3px rgba(0,0,0,0.9);
  }

  /* Section-to-section wipe. */
  #fade { inset: 0; background: #060910; }
</style>
</head>
<body>
<div id="stage">
  <div id="bg"></div>
  <div id="bg-glow"></div>

  <div id="phone">
    <div id="screen">
      <div id="camera">
        <img id="imgA" alt="" />
        <img id="imgB" alt="" />
      </div>
      <div id="annot">
        <div id="dim"></div>
        <div id="spot"></div>
        <div id="ring"></div>
        <div id="ripple"></div>
        <div id="arrow"><svg viewBox="0 0 100 40" preserveAspectRatio="none">
          <path d="M4,20 L80,20" stroke="currentColor" stroke-width="6" stroke-linecap="round" fill="none"/>
          <path d="M68,6 L88,20 L68,34" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        </svg></div>
        <div id="pointer"></div>
      </div>
    </div>
  </div>

  <div id="hud">
    <div id="callout"><b></b><i></i></div>
    <div id="chapter"><span class="kicker"></span><span class="title"></span><span class="rule"></span></div>
    <div id="sub"></div>
    <div id="fade"></div>
  </div>
</div>

<script src="./player.js"></script>
</body>
</html>
