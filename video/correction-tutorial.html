</style></head><body><main class="stage"><div class="brand">Watcon Conveyance Tracker</div><div class="title">Correct a trip distance</div><div class="sub">Use Google Maps to submit the right travel distance for review.</div><section class="phone"><div class="notch"></div><div class="appbar"><div class="appname">WATCON CONVEYANCE TRACKER</div><div class="page">Today's Summary</div></div><div class="content"><div class="label">TRIP 1</div><div class="trip"><div class="route">Head Office → Soni Farm</div><div class="muted">Bike · Recorded journey</div><div class="stats"><div class="stat"><div class="label">RECORDED</div><b>16.20 km</b></div><div class="stat"><div class="label">AMOUNT</div><b>₹64.80</b></div></div></div><div id="correct" class="correct"><div class="icon">✎</div><div><b>Correct Distance</b><span>Fix an incorrect trip distance</span></div></div><div id="dialog" class="dialog"></div></div></section><div id="pointer" class="pointer"></div><div id="callout" class="callout"></div></main><script>
